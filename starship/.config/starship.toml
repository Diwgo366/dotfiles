# ====================================================================
# CONFIGURACIÓN DE STARSHIP - Terminal prompt
# ====================================================================
# Tema: Dracula con CaskayDiamono Nerd Font
# Layout: 2 líneas (Hora + Contexto en L1, Entrada en L2)
# ====================================================================

palette = 'custom_dotfiles'
format = """
$time\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$docker_context\
$python\
$lua\
$line_break\
$cmd_duration\
$status\
$character"""

# ====================================================================
# CARÁCTER DE ENTRADA (Triángulo recto)
# ====================================================================
[character]
error_symbol = "[▸](bold red)"
success_symbol = "[▸](bold green)"

# ====================================================================
# LÍNEA 1: INFORMACIÓN DEL CONTEXTO
# ====================================================================

[time]
disabled = false
style = "bold green"
format = "[ $time]($style)"
time_format = "%H:%M"

[username]
show_always = true
format = " ║ [ $user]($style)"
style_user = "bold cyan"
style_root = "bold red"

[hostname]
ssh_only = false
ssh_symbol = ""
format = " [  $hostname]($style)"
style = "bold pink"

[directory]
truncation_length = 0
truncate_to_repo = false
format = " ║ [$path]($style)[$read_only]($read_only_style)"
style = "bold purple"
read_only = " "
read_only_style = "bold red"
home_symbol = "~"

[directory.substitutions]
"Documentos" = " "
"Descargas" = " "
"Música" = " "
"Imágenes" = " "
"Vídeos" = " "
"Scripts" = " "
"Dotfiles" = " "

[git_branch]
style = "bold orange"
format = " ║ [$symbol$branch]($style)"
symbol = " "

[git_status]
format = " [$all_status$ahead_behind]($style)"
# Estados de Git con símbolos elegantes y colores individuales:
# ●  = Modificado (archivo editado, no guardado)
# ⊕  = Staged (cambios preparados para commit)
# ⊖  = Deletado (archivo eliminado)
# ⟳  = Renombrado (archivo cambió de nombre)
# ◯  = Sin seguimiento (archivo nuevo no rastreado)
# ◎  = Stashed (cambios guardados temporalmente)
# ✕  = Conflicto (conflicto de merge sin resolver)
conflicted = "[ ✕](bold red)"
ahead = "[ ⇧ ${count}](bold orange)"
behind = "[ ⇩ ${count}](bold cyan)"
diverged = "[ ⇳ ⇧ ${ahead_count} ⇩ ${behind_count}](bold yellow)"
untracked = "[ ◯](bold magenta)"
stashed = "[ ◎](bold blue)"
modified = "[ ●](bold yellow)"
staged = "[ ⊕](bold green)"
renamed = "[ ⟳](bold cyan)"
deleted = "[ ⊖](bold red)"

[docker_context]
style = "bold blue"
format = " ║ [$symbol$context]($style)"
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]
symbol = " "

[python]
style = "bold yellow"
format = " ║ [$symbol$version]($style)"
symbol = " "

# ====================================================================
# LÍNEA 2: INFORMACIÓN DEL COMANDO
# ====================================================================

[cmd_duration]
min_time = 500
style = "bold yellow"
format = "[ $duration]($style) "

[status]
style = "bold red"
success_style = "bold green"
symbol = "✕ "
success_symbol = "✓ "
format = " [$symbol]($style)"
map_symbol = true
disabled = false
pipestatus = true


# ==============================================================
# Colores generados por colors/themes/starship.sh
# ==============================================================
[palettes.custom_dotfiles]
purple = "#BD93F9"
pink = "#ff79c6"
orange = "#FFB86C"
cyan = "#8BE9FD"
green = "#50FA7B"
red = "#FF5555"
yellow = "#F1FA8C"
blue = "#75D7EC"
magenta = "#E356A7"
white = "#f8f8f2"
black = "#262626"