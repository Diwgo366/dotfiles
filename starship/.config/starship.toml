# ====================================================================
# CONFIGURACIÓN DE STARSHIP - Terminal prompt
# ====================================================================
# Tema: Dracula con CaskayDiamono Nerd Font
# Layout: 2 líneas (Hora + Contexto en L1, Entrada en L2)
# ====================================================================

palette = "dracula"
format = """
$time\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$docker_context\
$python\
$jupyter\
$lua\
$bash\
$line_break\
$cmd_duration\
$status\
$character"""

# ====================================================================
# CARÁCTER DE ENTRADA (Triángulo recto)
# ====================================================================
[character]
error_symbol = "[▸](bold red)"
success_symbol = "[▸](bold green)"

# ====================================================================
# LÍNEA 1: INFORMACIÓN DEL CONTEXTO
# ====================================================================

[time]
disabled = false
style = "bold green"
format = "[$time]($style)"
time_format = "%H:%M"

[username]
show_always = true
format = " ║ [$user]($style)"
style_user = "bold cyan"
style_root = "bold red"

[hostname]
ssh_only = true
ssh_symbol = " "
format = " ◈ [$hostname]($style)"
style = "bold pink"

[directory]
truncation_length = 0
truncate_to_repo = false
format = " ║ [$path]($style)[$read_only]($read_only_style)"
style = "bold purple"
read_only = " "
read_only_style = "bold red"
home_symbol = "~"

[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
style = "bold orange"
format = " ║ [$symbol$branch]($style)"
symbol = " "

[git_status]
format = " [$all_status$ahead_behind]($style)"
# Estados de Git con símbolos elegantes y colores individuales:
# ●  = Modificado (archivo editado, no guardado)
# ⊕  = Staged (cambios preparados para commit)
# ⊖  = Deletado (archivo eliminado)
# ⟳  = Renombrado (archivo cambió de nombre)
# ◯  = Sin seguimiento (archivo nuevo no rastreado)
# ◎  = Stashed (cambios guardados temporalmente)
# ✕  = Conflicto (conflicto de merge sin resolver)
conflicted = "[✕ ](bold red)"
ahead = "[⇧ ${count}](bold green)"
behind = "[⇩ ${count}](bold cyan)"
diverged = "[⇳ ⇧ ${ahead_count} ⇩ ${behind_count}](bold yellow)"
untracked = "[◯](bold magenta)"
stashed = "[◎](bold blue)"
modified = "[●](bold yellow)"
staged = "[⊕](bold green)"
renamed = "[⟳](bold cyan)"
deleted = "[⊖](bold red)"

[docker_context]
style = "bold blue"
format = " ║ [🐳 $context]($style)"
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

[python]
style = "bold blue"
format = " ║ [🐍 $version]($style)"
symbol = ""

[jupyter]
style = "bold orange"
format = " ║ [📓 $version]($style)"
symbol = ""

[lua]
style = "bold cyan"
format = " ║ [🌙 $version]($style)"
symbol = ""

[bash]
style = "bold green"
format = " ║ [🔨 $version]($style)"
symbol = ""

# ====================================================================
# LÍNEA 2: INFORMACIÓN DEL COMANDO
# ====================================================================

[cmd_duration]
min_time = 500
style = "bold yellow"
format = " ║ [$duration]($style)"

[status]
style = "bold red"
symbol = "✕"
success_symbol = ""
format = " [$symbol]($style)"
map_symbol = true
disabled = false
pipestatus = true

# ====================================================================
# PALETA DE COLORES - DRACULA
# ====================================================================
[palettes.dracula]
background = "#282a36"
current_line = "#44475a"
foreground = "#f8f8f2"
comment = "#6272a4"
cyan = "#8be9fd"
green = "#50fa7b"
orange = "#ffb86c"
pink = "#ff79c6"
purple = "#bd93f9"
red = "#ff5555"
yellow = "#f1fa8c"
white = "#f8f8f2"
blue = "#8be9fd"
