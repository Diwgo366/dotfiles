# Generated by HyprMod

# Environment
env = XCURSOR_THEME,Future-cyan-cursors
env = XCURSOR_SIZE,24

# Settings
decoration:active_opacity = 0.9
decoration:blur:contrast = 0.9
decoration:blur:enabled = false
decoration:blur:ignore_opacity = false
decoration:blur:new_optimizations = true
decoration:blur:noise = 0.015
decoration:blur:passes = 1
decoration:blur:size = 1
decoration:blur:vibrancy = 0.1
decoration:inactive_opacity = 0.9
decoration:rounding = 10
decoration:shadow:color = 0xff0d315a
decoration:shadow:color_inactive = 0xff000000
decoration:shadow:enabled = false
decoration:shadow:range = 3
decoration:shadow:render_power = 2
general:border_size = 2
general:col.active_border = 0xfff8f8f2 0deg
general:col.inactive_border = 0xff7a7a7a 0deg
general:gaps_out = 10
general:layout = master
input:sensitivity = 1.0
master:mfact = 0.5
master:new_status = slave

# Bezier curves
bezier = easeInSine,0.12,0.0,0.39,0.0

# Animations
animation = global, 0
animation = windowsIn, 1, 8.0, default, popin
animation = windowsOut, 1, 8.0, default, popin
animation = windowsMove, 1, 8.0, default
animation = layersIn, 1, 8.0, default, slide top
animation = layersOut, 1, 8.0, default, slide top
animation = fade, 1, 1.0, default
animation = fadeIn, 1, 8.0, default
animation = fadeOut, 1, 8.0, default
animation = fadeLayersIn, 1, 8.0, default
animation = fadeLayersOut, 1, 8.0, default

animation = border, 1, 1.0, default
animation = borderangle, 1, 1.0, default
animation = workspaces, 1, 6.0, default, slide
animation = zoomFactor, 0
animation = monitorAdded, 1, 1.0, default

# Layer rules
layerrule = no_anim on, match:namespace hyprpicker
layerrule = animation popin, match:namespace selection

# Window rules
windowrule = match:class ^(brave\-browser)$, opaque on
windowrule = match:class ^(wofi)$, stay_focused on
windowrule = match:class ^(wofi)$, suppress_event change_focused
windowrule = match:class ^(firefox)$, opaque on
windowrule = match:class ^(xdg\-desktop\-portal\-gtk)$, size 900 600
windowrule = match:class ^(xdg\-desktop\-portal\-gtk)$, center on
windowrule = match:class ^$, no_blur on
