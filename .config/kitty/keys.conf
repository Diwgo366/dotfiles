
# ============================================================
# TABS
# ============================================================

# Nuevo tab
map Ctrl+Shift+T new_tab

# Cerrar tab
map Ctrl+Shift+Q close_tab

# Siguiente tab
map Ctrl+Shift+Super+RIGHT next_tab

# Tab anterior
map Ctrl+Shift+Super+LEFT previous_tab

# Ir a tabs específicos
map Ctrl+Shift+1 goto_tab 1
map Ctrl+Shift+2 goto_tab 2
map Ctrl+Shift+3 goto_tab 3
map Ctrl+Shift+4 goto_tab 4
map Ctrl+Shift+5 goto_tab 5
map Ctrl+Shift+6 goto_tab 6
map Ctrl+Shift+7 goto_tab 7
map Ctrl+Shift+8 goto_tab 8
map Ctrl+Shift+9 goto_tab 9

# Renombrar tab
map Ctrl+Shift+R set_tab_title

# Mover tab
map Ctrl+Super+LEFT move_tab_backward
map Ctrl+Super+RIGHT move_tab_forward


# ============================================================
# PANELES / SPLITS
# ============================================================

# Split horizontal
map Ctrl+Shift+COMMA launch --location=hsplit

# Split vertical
map Ctrl+Shift+PERIOD launch --location=vsplit

# Cerrar panel
map Ctrl+Shift+W close_window

# Maximizar panel
map Ctrl+Shift+F toggle_layout stack


# ============================================================
# NAVEGACIÓN ENTRE PANELES
# ============================================================

map Ctrl+Shift+LEFT neighboring_window left
map Ctrl+Shift+DOWN neighboring_window down
map Ctrl+Shift+UP neighboring_window up
map Ctrl+Shift+RIGHT neighboring_window right


# ============================================================
# MOVER PANELES
# ============================================================

map Ctrl+Super+Alt+LEFT move_window left
map Ctrl+Super+Alt+DOWN move_window down
map Ctrl+Super+Alt+UP move_window up
map Ctrl+Super+Alt+RIGHT move_window right


# ============================================================
# REDIMENSIONAR PANELES
# ============================================================

map Alt+LEFT resize_window narrower 5
map Alt+RIGHT resize_window wider 5
map Alt+UP resize_window taller 1
map Alt+DOWN resize_window shorter 1


# ============================================================
# LAYOUTS
# ============================================================

# Tall layout
#map ctrl+shift+b goto_layout tall

# Grid layout
#map ctrl+shift+g goto_layout grid

# Vertical layout
#map ctrl+shift+v goto_layout vertical

# Horizontal layout
#map ctrl+shift+x goto_layout horizontal

# Stack layout
#map ctrl+shift+s goto_layout stack

# Fat layout
#map ctrl+shift+f goto_layout fat

# Rotar layouts
#map ctrl+shift+space next_layout


# ============================================================
# SCROLL
# ============================================================

# Scroll arriba
map Ctrl+UP scroll_line_up

# Scroll abajo
map Ctrl+DOWN scroll_line_down

# Página arriba
#map shift+page_up scroll_page_up

# Página abajo
#map shift+page_down scroll_page_down

# Inicio del scrollback
# map Ctrl+Super scroll_home

# Final del scrollback
#map ctrl+shift+end scroll_end


# ============================================================
# COPY / PASTE
# ============================================================

# Copiar selección
map Ctrl+Shift+C copy_to_clipboard

# Pegar
map Ctrl+Shift+V paste_from_clipboard

# Selección desde scrollback
# map Ctrl+Shift+S show_scrollback


# ============================================================
# BÚSQUEDA
# ============================================================

# Buscar en scrollback
#map ctrl+shift+slash show_scrollback

# Abrir hints (URLs, paths, etc)
map Ctrl+Shift+E kitten hints


# ============================================================
# FUENTE
# ============================================================

# Incrementar tamaño fuente
#map ctrl+shift+plus change_font_size all +2.0

# Disminuir tamaño fuente
#map ctrl+shift+minus change_font_size all -2.0

# Reset tamaño fuente
#map ctrl+shift+backspace change_font_size all 0


# ============================================================
# CONFIGURACIÓN
# ============================================================

# Recargar config
map Ctrl+Shift+F5 load_config_file

# Abrir config en nvim
map Ctrl+Shift+F2 launch --type=os-window nvim ~/.config/kitty/kitty.conf


# ============================================================
# SESIONES
# ============================================================

# Nuevo OS window
map Ctrl+Shift+N new_os_window

# Duplicar panel actual
#map ctrl+shift+d launch --cwd=current

# Abrir terminal en mismo directorio
#map ctrl+shift+o launch --cwd=current


# ============================================================
# UTILIDADES
# ============================================================

# Limpiar terminal
map Ctrl+Shift+K clear_terminal reset active

# Abrir comando rápido
map Ctrl+Shift+P kitty_shell window

# Mostrar unicode picker
map Ctrl+Shift+U kitten unicode_input

# Mostrar clipboard
map Ctrl+Shift+Y kitten clipboard


# ============================================================
# LAYOUTS HABILITADOS
# ============================================================

enabled_layouts splits, stack

# ============================================================
# SESIONES
# ============================================================

map Ctrl+Shift+G goto_session ~/.config/kitty/sessions/dev.kitty-session
